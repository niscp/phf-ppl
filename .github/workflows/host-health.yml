name: Check PHFPL host health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/host-health.yml'

permissions:
  contents: read
  id-token: write

jobs:
  health:
    name: Read-only host health check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assume AWS health-check role through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: phfppl-health-${{ github.run_id }}

      - name: Run read-only checks through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          jq -n '{commands:[
            "set -u",
            "echo HOST",
            "hostname",
            "date -Is",
            "uptime",
            "echo MEMORY",
            "free -h",
            "echo DISK",
            "df -h / /var/lib/docker 2>/dev/null | sort -u",
            "echo SERVICES",
            "for service in nginx docker; do printf \"%s: \" \"$service\"; systemctl is-active \"$service\" || true; done",
            "echo CONTAINERS",
            "docker ps --format \"{{.Names}}|{{.Status}}|{{.Ports}}\"",
            "echo CONTAINER_RESOURCES",
            "docker stats --no-stream --format \"{{.Name}}|CPU {{.CPUPerc}}|MEM {{.MemUsage}}\"",
            "echo LOCAL_HEALTH",
            "curl -fsS --max-time 5 http://127.0.0.1:8280/health",
            "echo",
            "echo HTTPS",
            "curl -kfsS --max-time 8 -o /dev/null -w \"home=%{http_code} time=%{time_total}s\\n\" https://phfppl.dwemory.com/",
            "curl -kfsS --max-time 8 -o /dev/null -w \"api=%{http_code} time=%{time_total}s\\n\" https://phfppl.dwemory.com/api/auction",
            "echo FAILED_UNITS",
            "systemctl --failed --no-legend || true",
            "echo NGINX_ERRORS",
            "journalctl -u nginx --since \"2 hours ago\" -p warning --no-pager -n 30 || true",
            "echo DOCKER_ERRORS",
            "journalctl -u docker --since \"2 hours ago\" -p warning --no-pager -n 30 || true"
          ]}' > /tmp/ssm-health-parameters.json

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Read-only PHFPL host health check" \
            --parameters file:///tmp/ssm-health-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" || true

          result="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID")"

          printf '%s\n' "$result" | jq -r '.StandardOutputContent'
          printf '%s\n' "$result" | jq -r '.StandardErrorContent' >&2
          test "$(printf '%s' "$result" | jq -r '.Status')" = "Success"
