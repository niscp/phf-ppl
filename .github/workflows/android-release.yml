name: Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/keystores
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystores/auction-arena-upload.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=../keystores/auction-arena-upload.jks\n'
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: dart test
      - run: flutter build appbundle --release
      - run: flutter build apk --release

      - name: Publish checksums
        run: shasum -a 256 build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: auction-arena-android-1.0.0-1
          if-no-files-found: error
          retention-days: 30
          path: |
            flutter-app/build/app/outputs/bundle/release/app-release.aab
            flutter-app/build/app/outputs/flutter-apk/app-release.apk
            flutter-app/build/app/outputs/SHA256SUMS
