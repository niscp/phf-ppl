services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phf_auction
      POSTGRES_USER: phf_auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phf_auction -d phf_auction"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile.auction
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://phf_auction:${POSTGRES_PASSWORD}@postgres:5432/phf_auction
      JWT_SECRET: ${JWT_SECRET}
      SYNC_SECRET: ${SYNC_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:8280:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -h postgres -U phf_auction -d phf_auction -Fc > "/backups/phf-auction-$${stamp}.dump.tmp" &&
            mv "/backups/phf-auction-$${stamp}.dump.tmp" "/backups/phf-auction-$${stamp}.dump"
          find /backups -type f -name 'phf-auction-*.dump' -mtime +14 -delete
          sleep 300
        done

volumes:
  postgres_data:
